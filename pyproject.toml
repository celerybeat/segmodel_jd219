[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "celerybeat-segmodel_jd219"
version = "0.1.0"
description = "把候选项映射到类别上，算出图像分割研究员·量化位宽与精度回退的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "celerybeat" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://celerybeat.github.io"
Repository = "https://github.com/celerybeat/segmodel_jd219"
Issues = "https://github.com/celerybeat/segmodel_jd219/issues"

[project.scripts]
segmodel_jd219 = "segmodel_jd219:main"

[tool.setuptools]
py-modules = ["segmodel_jd219"]
